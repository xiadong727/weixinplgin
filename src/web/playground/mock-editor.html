<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>模拟公众号编辑器（仅开发用）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.6 -apple-system, 'PingFang SC', sans-serif; background: #f2f3f5; color: #1f2328; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 20px 20px 60px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .note { font-size: 12px; color: #6b7280; margin: 0 0 16px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .title-input { width: 100%; font-size: 20px; font-weight: 600; border: none; border-bottom: 1px solid #e5e7eb; padding: 8px 2px; outline: none; }
    #ueditor_0 { width: 100%; height: 460px; border: 1px solid #e5e7eb; border-radius: 4px; background: #fff; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; align-items: center; }
    .controls label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
    .log { font-family: Menlo, Consolas, monospace; font-size: 11.5px; background: #1f2328; color: #d1d5db; border-radius: 6px; padding: 10px 12px; max-height: 170px; overflow: auto; white-space: pre-wrap; }
    button { font: inherit; font-size: 12.5px; padding: 5px 10px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>模拟公众号编辑器</h1>
    <p class="note">
      仿照后台「新建图文消息」的 iframe + contenteditable 结构，用来验证扩展的三级注入降级。
      右侧绿色「排版」条就是扩展面板，写点 Markdown 后点「一键排版并插入正文」。
    </p>

    <div class="card controls">
      <label><input type="checkbox" id="opt-paste" checked /> 编辑器处理 paste 事件（一级通道）</label>
      <label><input type="checkbox" id="opt-exec" checked /> 允许 execCommand（二级通道）</label>
      <label><input type="checkbox" id="opt-editor" checked /> 页面里存在编辑器</label>
      <label><input type="checkbox" id="opt-normalize" /> 粘贴后自动规整 HTML（模拟微信补 data-* / 重写 style）</label>
      <label><input type="checkbox" id="opt-revert" /> 受控编辑器：写入后 400ms 还原成占位内容</label>
      <label><input type="checkbox" id="opt-revert-prev" /> 受控编辑器：写入后 400ms 回退到上一版（文字不变、样式回退）</label>
      <label><input type="checkbox" id="opt-pm" /> 模拟 ProseMirror：只认 execCommand('selectAll') 的全选，手工 Range 视为未选中（粘贴变追加）</label>
      <label><input type="checkbox" id="opt-append" /> 最坏情况：粘贴永远只追加，从不替换选区</label>
      <button id="btn-clear-log" type="button">清空日志</button>
      <button id="btn-dump" type="button">打印正文 HTML 长度</button>
      <button id="btn-save" type="button">模拟「保存草稿」（给每个表格补空骨架）</button>
      <label><input type="checkbox" id="opt-pm-table" /> 模拟 prosemirror-tables：剥掉 caption/colgroup 上的 style</label>
    </div>

    <div class="card">
      <div id="fake-title" contenteditable="true" style="font-size:20px;font-weight:600;padding:8px 2px;border-bottom:1px solid #e5e7eb;outline:none">测试文章标题（这个也是 contenteditable，不能被选成正文）</div>
      <div id="editor-slot" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div style="font-size:12px;color:#6b7280;margin-bottom:6px">编辑器事件日志</div>
      <div class="log" id="log">等待操作……</div>
    </div>
  </div>

  <script type="module" src="./mock.ts"></script>
</body>
</html>
